<!DOCTYPE html>
<html lang="en-NG">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon1.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#9c1214" />
    <meta name="robots" content="index, follow" />
    
    <!-- Primary SEO Metadata -->
    <title>Every Power Shall Bow Church of Christ | Bible-Believing Church in Lagos</title>
    <meta name="description" content="Welcome to Every Power Shall Bow Church of Christ in Lagos, Nigeria. Join us this Sunday at 8:00 AM for prophetic prayers, Spirit-filled worship, and practical Bible teaching." />
    <meta name="keywords" content="Every Power Shall Bow, Church of Christ, church in Lagos, Bible believing church Nigeria, prophetic prayer night, Sunday worship Lagos, Christian fellowship, prayer request" />
    <link rel="canonical" href="https://github.io" />

    <!-- Open Graph / Facebook Social Media Engine -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://github.io" />
    <meta property="og:title" content="Every Power Shall Bow Church of Christ | Lagos, Nigeria" />
    <meta property="og:description" content="Experience Spirit-led worship, breakthroughs, and practical word teaching. Raising a generation that walks in dominion through Christ." />
    <meta property="og:image" content="%PUBLIC_URL%/logo512.png" />

    <!-- Twitter Social Metadata Card Configs -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Every Power Shall Bow Church of Christ" />
    <meta name="twitter:description" content="Join us for fellowship, prophetic prayers, and spiritual growth in Lagos, Nigeria." />
    <meta name="twitter:image" content="%PUBLIC_URL%/logo512.png" />
    
    <!-- Mobile Integration Configurations -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- FIXED: Google Typography Fonts Preconnect Engine Subdomains -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Google Structured Schema JSON-LD Data for Churches -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "PlaceOfWorship",
        "name": "Every Power Shall Bow Church of Christ",
        "description": "A Bible-believing, Spirit-filled family committed to raising disciples who dominate in every sphere of life.",
        "url": "https://github.io",
        "logo": "https://github.iologo192.png",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "13b Sabituyi Close, Off Akunne Street, Oluti",
          "addressLocality": "Lagos",
          "addressCountry": "NG"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "Sunday",
            "opens": "08:00",
            "closes": "12:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "Tuesday",
            "opens": "8:00",
            "closes": "20:00"
          }
        ]
      }
    </script>
